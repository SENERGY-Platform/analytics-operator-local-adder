name: '[builder] Docker'

# main builds :latest as before plus :vX.Y.Z; a release/vN branch keeps an older major
# alive and builds only its :vN.x.y on ghcr. The git tag is pushed after the image, so a
# failed build never consumes a version.
on:
  push:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  multi-ghcr:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: |
        ghcr.io/senergy-platform/analytics-operator-local-adder
      meta-tags: |
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

  multi-dockerhub:
    needs: version
    if: github.ref_name == 'main'
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: |
        smartenergyplatform/analytics-operator-local-adder
      meta-tags: |
        type=raw,value=latest
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

  # The tag follows the images, so a failed build never consumes a version.
  tag:
    needs: [version, multi-ghcr, multi-dockerhub]
    # multi-dockerhub is skipped on release branches; a failed or cancelled build still stops this job.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push version tag
        run: |
          tag='${{ needs.version.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
